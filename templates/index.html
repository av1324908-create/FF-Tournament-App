<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Free Fire Tournament Hub</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0b0b;
    color: white;
}

.container {
    width: 95%;
    max-width: 1100px;
    margin: auto;
}

header {
    background: #111;
    padding: 18px 0;
    border-bottom: 1px solid #333;
}

header h1 {
    margin: 0;
    text-align: center;
    color: #ff9800;
}

.auth-box {
    background: #151515;
    padding: 20px;
    border-radius: 12px;
    margin: 20px 0;
}

input,
textarea,
button {
    font-family: Arial, sans-serif;
}

input,
textarea {
    width: 100%;
    padding: 12px;
    margin: 7px 0;
    border: none;
    border-radius: 7px;
}

textarea {
    min-height: 130px;
    resize: vertical;
}

button {
    padding: 11px 18px;
    border: none;
    border-radius: 7px;
    background: #ff9800;
    color: #111;
    font-weight: bold;
    cursor: pointer;
    margin-top: 7px;
}

button:hover {
    opacity: .9;
}

button:disabled {
    background: #555;
    color: #aaa;
    cursor: not-allowed;
}

.card {
    background: #151515;
    border: 1px solid #292929;
    border-radius: 14px;
    padding: 18px;
    margin: 15px 0;
}

.card h2 {
    color: #ff9800;
    margin-top: 0;
}

.info {
    line-height: 1.9;
    color: #ddd;
}

.status {
    display: inline-block;
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: bold;
}

.status-upcoming {
    background: #164b23;
    color: #5cff7b;
}

.status-live {
    background: #571616;
    color: #ff5555;
}

.status-completed {
    background: #333;
    color: #ccc;
}

.form-box {
    display: none;
    background: #101010;
    padding: 15px;
    margin-top: 12px;
    border-radius: 9px;
}

.message {
    margin-top: 10px;
    font-weight: bold;
}

.wallet {
    background: #1c1400;
    border: 1px solid #8a6200;
    padding: 15px;
    border-radius: 12px;
    margin: 15px 0;
    color: #ffd54f;
}

.rules {
    background: #0f0f0f;
    border: 1px solid #444;
    padding: 15px;
    border-radius: 10px;
    margin-top: 12px;
    white-space: pre-wrap;
    line-height: 1.7;
    color: #ddd;
}

.results {
    margin-top: 15px;
}

.result-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    background: #101010;
    padding: 12px;
    margin: 6px 0;
    border-radius: 7px;
}

.notice-board {
    background: #201600;
    border: 1px solid #ff9d00;
    border-radius: 15px;
    padding: 16px;
    margin: 20px 0;
}

.notice-board h2 {
    margin-top: 0;
    color: #ffb000;
}

.notice-item {
    background: #151515;
    border-left: 4px solid #ff8c00;
    padding: 12px;
    border-radius: 9px;
    margin-top: 10px;
}

.notice-item h3 {
    margin: 0 0 6px;
    color: #fff;
}

.notice-item p {
    margin: 0;
    white-space: pre-wrap;
    line-height: 1.55;
    color: #ddd;
}

.notice-empty {
    color: #aaa;
    text-align: center;
    padding: 10px;
}

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
}

.hidden {
    display: none;
}

.section-title {
    margin-top: 30px;
    color: #ff9800;
}

.empty {
    background: #151515;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    color: #aaa;
}

.signup-login {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

@media(max-width:700px) {
    .signup-login {
        grid-template-columns: 1fr;
    }

    .result-row {
        flex-direction: column;
    }
}

</style>
</head>

<body>

<header>
    <div class="container">
        <h1>🔥 Free Fire Tournament Hub</h1>
    </div>
</header>

<div class="container">

    <div id="authSection" class="auth-box">

        <div class="signup-login">

            <div>
                <h2>🔐 Login</h2>

                <input
                    id="loginIdentifier"
                    placeholder="Username ya Email"
                >

                <input
                    id="loginPassword"
                    type="password"
                    placeholder="Password"
                >

                <button onclick="loginUser()">
                    Login
                </button>

                <div id="loginMessage" class="message"></div>
            </div>

            <div>
                <h2>📝 Signup</h2>

                <input
                    id="signupUsername"
                    placeholder="Username"
                >

                <input
                    id="signupEmail"
                    type="email"
                    placeholder="Email"
                >

                <input
                    id="signupUID"
                    placeholder="Free Fire UID"
                >

                <input
                    id="signupPassword"
                    type="password"
                    placeholder="Password"
                >

                <input
                    id="signupConfirm"
                    type="password"
                    placeholder="Confirm Password"
                >

                <button onclick="signupUser()">
                    Create Account
                </button>

                <div id="signupMessage" class="message"></div>
            </div>

        </div>

    </div>

    <div id="userSection" class="hidden">

        <div class="top-bar">

            <h2>
                👋 Welcome,
                <span id="usernameDisplay"></span>
            </h2>

            <button onclick="logoutUser()">
                Logout
            </button>

        </div>

        <div class="wallet">

            💰 Your Wallet:
            <strong>
                <span id="walletBalance">0</span>
            </strong>
            Tokens

        </div>

    </div>

    <div class="notice-board">

        <h2>📢 Notice Board</h2>

        <div id="noticeBoard">

            <div class="notice-empty">
                Loading notices...
            </div>

        </div>

    </div>

    <h2 class="section-title">
        🏆 Upcoming Tournaments
    </h2>

    <div id="upcomingTournaments">

        <div class="empty">
            Loading tournaments...
        </div>

    </div>

    <h2 class="section-title">
        🔴 Live Tournaments
    </h2>

    <div id="liveTournaments">

        <div class="empty">
            Abhi koi live tournament nahi hai.
        </div>

    </div>

    <h2 class="section-title">
        🏁 Completed Tournaments
    </h2>

    <div id="completedTournaments">

        <div class="empty">
            Abhi koi completed tournament nahi hai.
        </div>

    </div>

</div>

<script>

let currentUser = null;

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

async function checkUser() {

    try {

        const response =
            await fetch(
                "/api/auth/me",
                {
                    credentials: "same-origin"
                }
            );

        const data =
            await response.json();

        if (data.logged_in) {

            currentUser = data.user;

            showLoggedIn();

            await loadWallet();

        }

        else {

            currentUser = null;

            showLoggedOut();

        }

    }

    catch (error) {

        showLoggedOut();

    }

}

function showLoggedOut() {

    document
        .getElementById("authSection")
        .classList.remove("hidden");

    document
        .getElementById("userSection")
        .classList.add("hidden");

}

function showLoggedIn() {

    document
        .getElementById("authSection")
        .classList.add("hidden");

    document
        .getElementById("userSection")
        .classList.remove("hidden");

    document
        .getElementById("usernameDisplay")
        .innerText =
        currentUser.username || "";

}

async function signupUser() {

    const username =
        document
            .getElementById("signupUsername")
            .value.trim();

    const email =
        document
            .getElementById("signupEmail")
            .value.trim();

    const uid =
        document
            .getElementById("signupUID")
            .value.trim();

    const password =
        document
            .getElementById("signupPassword")
            .value;

    const confirm =
        document
            .getElementById("signupConfirm")
            .value;

    const message =
        document
            .getElementById("signupMessage");

    if (
        !username ||
        !email ||
        !uid ||
        !password
    ) {

        message.innerText =
            "❌ Sabhi fields bharo.";

        return;

    }

    message.innerText =
        "⏳ Account create ho raha hai...";

    try {

        const response =
            await fetch(
                "/api/auth/signup",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        username:
                            username,

                        email:
                            email,

                        uid:
                            uid,

                        password:
                            password,

                        confirm_password:
                            confirm

                    })
                }
            );

        const data =
            await response.json();

        if (data.success) {

            message.innerText =
                "✅ Signup successful! Ab login karo.";

            document
                .getElementById("signupUsername")
                .value = "";

            document
                .getElementById("signupEmail")
                .value = "";

            document
                .getElementById("signupUID")
                .value = "";

            document
                .getElementById("signupPassword")
                .value = "";

        }

        else {

            message.innerText =
                "❌ " +
                (
                    data.message ||
                    "Signup failed."
                );

        }

    }

    catch (error) {

        message.innerText =
            "❌ Server error.";

    }

}

async function loginUser() {

    const identifier =
        document
            .getElementById("loginIdentifier")
            .value.trim();

    const password =
        document
            .getElementById("loginPassword")
            .value;

    const message =
        document
            .getElementById("loginMessage");

    if (!identifier || !password) {

        message.innerText =
            "❌ Username/email aur password bharo.";

        return;

    }

    message.innerText =
        "⏳ Login ho raha hai...";

    try {

        const response =
            await fetch(
                "/api/auth/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    credentials:
                        "same-origin",

                    body: JSON.stringify({

                        identifier:
                            identifier,

                        password:
                            password

                    })
                }
            );

        const data =
            await response.json();

        if (data.success) {

            currentUser =
                data.user;

            showLoggedIn();

            await loadWallet();

            message.innerText = "";

        }

        else {

            message.innerText =
                "❌ " +
                (
                    data.message ||
                    "Login failed."
                );

        }

    }

    catch (error) {

        message.innerText =
            "❌ Server error.";

    }

}

async function logoutUser() {

    try {

        await fetch(
            "/api/auth/logout",
            {
                method: "POST",

                credentials:
                    "same-origin"
            }
        );

    }

    catch (error) {

    }

    currentUser = null;

    showLoggedOut();

    document
        .getElementById("walletBalance")
        .innerText = "0";

}

async function loadWallet() {

    if (!currentUser) {
        return;
    }

    try {

        const response =
            await fetch(
                `/api/wallet/${encodeURIComponent(currentUser.uid)}`
            );

        const data =
            await response.json();

        document
            .getElementById("walletBalance")
            .innerText =
            data.balance ?? 0;

    }

    catch (error) {

        document
            .getElementById("walletBalance")
            .innerText =
            "0";

    }

}

async function loadNotices() {

    try {

        const response =
            await fetch(
                "/api/notices"
            );

        const notices =
            await response.json();

        const box =
            document
                .getElementById("noticeBoard");

        if (
            !Array.isArray(notices) ||
            notices.length === 0
        ) {

            box.innerHTML = `
                <div class="notice-empty">
                    📭 Abhi koi important notice nahi hai.
                </div>
            `;

            return;

        }

        box.innerHTML =
            notices.map(
                n => `

                <div class="notice-item">

                    <h3>
                        📌
                        ${escapeHTML(n.title)}
                    </h3>

                    <p>
                        ${escapeHTML(n.message)}
                    </p>

                </div>

            `
            ).join("");

    }

    catch (error) {

        document
            .getElementById("noticeBoard")
            .innerHTML = `
                <div class="notice-empty">
                    Notice load nahi ho paaye.
                </div>
            `;

    }

}

async function loadTournaments() {

    try {

        const response =
            await fetch(
                "/api/tournaments"
            );

        const tournaments =
            await response.json();

        const upcomingBox =
            document
                .getElementById(
                    "upcomingTournaments"
                );

        const liveBox =
            document
                .getElementById(
                    "liveTournaments"
                );

        const completedBox =
            document
                .getElementById(
                    "completedTournaments"
                );

        upcomingBox.innerHTML = "";
        liveBox.innerHTML = "";
        completedBox.innerHTML = "";

        let upcomingCount = 0;
        let liveCount = 0;
        let completedCount = 0;

        tournaments.forEach(
            t => {

                const status =
                    t.status ||
                    "upcoming";

                const players =
                    Array.isArray(t.players)
                        ? t.players
                        : [];

                const booked =
                    players.length;

                let statusHTML = "";

                if (
                    status ===
                    "live"
                ) {

                    statusHTML = `
                        <span
                            class="status status-live"
                        >
                            🔴 LIVE
                        </span>
                    `;

                }

                else if (
                    status ===
                    "completed"
                ) {

                    statusHTML = `
                        <span
                            class="status status-completed"
                        >
                            🏁 COMPLETED
                        </span>
                    `;

                }

                else {

                    statusHTML = `
                        <span
                            class="status status-upcoming"
                        >
                            🟢 UPCOMING
                        </span>
                    `;

                }

                let registrationHTML = "";

                if (
                    status ===
                    "upcoming"
                ) {

                    if (
                        t.registered
                    ) {

                        registrationHTML = `
                            <button disabled>
                                ✅ Already Registered
                            </button>
                        `;

                    }

                    else if (
                        booked >=
                        t.max_players
                    ) {

                        registrationHTML = `
                            <button disabled>
                                ❌ Tournament Full
                            </button>
                        `;

                    }

                    else if (
                        !currentUser
                    ) {

                        registrationHTML = `
                            <button
                                onclick="
                                    alert(
                                        'Pehle login karo.'
                                    )
                                "
                            >
                                🔐 Login to Register
                            </button>
                        `;

                    }

                    else {

                        registrationHTML = `

                            <button
                                onclick="
                                    showForm(
                                        ${t.id}
                                    )
                                "
                            >
                                🎮 Register Now
                            </button>

                            <div
                                class="form-box"
                                id="form-${t.id}"
                            >

                                <input
                                    id="name-${t.id}"
                                    placeholder="Player Name"
                                >

                                <input
                                    id="uid-${t.id}"
                                    placeholder="Free Fire UID"
                                    value="${escapeHTML(
                                        currentUser.uid
                                    )}"
                                >

                                <button
                                    onclick="
                                        registerPlayer(
                                            ${t.id}
                                        )
                                    "
                                >
                                    Confirm Registration
                                </button>

                                <div
                                    class="message"
                                    id="message-${t.id}"
                                ></div>

                            </div>

                        `;

                    }

                }

                let roomHTML = "";

                if (
                    t.registered &&
                    t.room_id &&
                    t.room_password
                ) {

                    roomHTML = `

                        <div
                            class="rules"
                        >

                            <strong>
                                🎮 Room Details
                            </strong>

                            <br><br>

                            Room ID:
                            ${escapeHTML(
                                t.room_id
                            )}

                            <br>

                            Room Password:
                            ${escapeHTML(
                                t.room_password
                            )}

                        </div>

                    `;

                }

                let rulesHTML = "";

                if (
                    t.rules &&
                    t.rules.trim()
                ) {

                    rulesHTML = `

                        <div
                            class="rules"
                        >

                            <strong>
                                📜 Tournament Rules
                            </strong>

                            <br><br>

                            ${escapeHTML(
                                t.rules
                            )}

                        </div>

                    `;

                }

                let resultsHTML = "";

                if (
                    status ===
                    "completed" &&
                    t.results_visible &&
                    players.length > 0
                ) {

                    const sortedPlayers =
                        [...players].sort(
                            (
                                a,
                                b
                            ) => {

                                const posA =
                                    Number(
                                        a.position ||
                                        999999
                                    );

                                const posB =
                                    Number(
                                        b.position ||
                                        999999
                                    );

                                if (
                                    posA !==
                                    posB
                                ) {

                                    return (
                                        posA -
                                        posB
                                    );

                                }

                                return (
                                    Number(
                                        b.kills ||
                                        0
                                    ) -
                                    Number(
                                        a.kills ||
                                        0
                                    )
                                );

                            }
                        );

                    resultsHTML = `

                        <div
                            class="results"
                        >

                            <h3>
                                🏆 Final Results
                            </h3>

                            ${sortedPlayers
                                .map(
                                    p => `

                                    <div
                                        class="result-row"
                                    >

                                        <span>

                                            #${p.position ||
                                            "-"}

                                            &nbsp;

                                            ${escapeHTML(
                                                p.name
                                            )}

                                        </span>

                                        <span>

                                            🎯
                                            ${
                                                p.kills ||
                                                0
                                            }
                                            Kills

                                        </span>

                                    </div>

                                `
                                )
                                .join("")}

                        </div>

                    `;

                }

                const tournamentCard = `

                    <div
                        class="card"
                    >

                        <h2>
                            🎮
                            ${escapeHTML(
                                t.name
                            )}
                        </h2>

                        <div
                            class="info"
                        >

                            💰 Entry Fee:
                            ₹${t.entry_fee}

                            <br>

                            🏆 1st Prize:
                            ₹${t.first_prize}

                            <br>

                            🎯 Per Kill:
                            ₹${t.kill_reward}

                            <br>

                            👥 Players:
                            ${booked}/${t.max_players}

                            <br>

                            📅 Date:
                            ${escapeHTML(
                                t.date_time
                            )}

                            <br>

                            Status:
                            ${statusHTML}

                        </div>

                        ${rulesHTML}

                        ${roomHTML}

                        ${resultsHTML}

                        ${registrationHTML}

                    </div>

                `;

                if (
                    status ===
                    "upcoming"
                ) {

                    upcomingBox.innerHTML +=
                        tournamentCard;

                    upcomingCount++;

                }

                else if (
                    status ===
                    "live"
                ) {

                    liveBox.innerHTML +=
                        tournamentCard;

                    liveCount++;

                }

                else {

                    completedBox.innerHTML +=
                        tournamentCard;

                    completedCount++;

                }

            }
        );

        if (
            upcomingCount === 0
        ) {

            upcomingBox.innerHTML = `
                <div class="empty">
                    😔 Abhi koi upcoming tournament nahi hai.
                </div>
            `;

        }

        if (
            liveCount === 0
        ) {

            liveBox.innerHTML = `
                <div class="empty">
                    Abhi koi live tournament nahi hai.
                </div>
            `;

        }

        if (
            completedCount === 0
        ) {

            completedBox.innerHTML = `
                <div class="empty">
                    Abhi koi completed tournament nahi hai.
                </div>
            `;

        }

    }

    catch (error) {

        document
            .getElementById(
                "upcomingTournaments"
            )
            .innerHTML = `
                <div class="empty">
                    ❌ Tournaments load nahi ho paaye.
                </div>
            `;

    }

}

function showForm(id) {

    const form =
        document
            .getElementById(
                `form-${id}`
            );

    if (
        !form
    ) {

        return;

    }

    if (
        form.style.display ===
        "block"
    ) {

        form.style.display =
            "none";

    }

    else {

        form.style.display =
            "block";

    }

}

async function registerPlayer(id) {

    if (!currentUser) {

        alert(
            "Pehle login karo."
        );

        return;

    }

    const name =
        document
            .getElementById(
                `name-${id}`
            )
            .value
            .trim();

    const uid =
        document
            .getElementById(
                `uid-${id}`
            )
            .value
            .trim();

    const message =
        document
            .getElementById(
                `message-${id}`
            );

    if (!name || !uid) {

        message.innerText =
            "❌ Name aur UID dono bharo.";

        return;

    }

    message.innerText =
        "⏳ Registering...";

    try {

        const response =
            await fetch(
                `/api/tournaments/${id}/players`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    credentials:
                        "same-origin",

                    body:
                        JSON.stringify({
                            name:
                                name,

                            uid:
                                uid
                        })
                }
            );

        const data =
            await response.json();

        if (
            data.success
        ) {

            message.innerText =
                "✅ Registration successful!";

            await loadWallet();

            await loadTournaments();

        }

        else {

            message.innerText =
                "❌ " +
                (
                    data.message ||
                    "Registration failed."
                );

        }

    }

    catch (error) {

        message.innerText =
            "❌ Server error.";

    }

}

checkUser();

loadNotices();

loadTournaments();

setInterval(
    loadTournaments,
    15000
);

setInterval(
    loadNotices,
    15000
);

setInterval(
    loadWallet,
    15000
);

</script>

</body>
</html>
