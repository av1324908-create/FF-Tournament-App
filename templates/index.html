<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>FF Tournament Hub</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0d0d0d;
    color: white;
}

header {
    background: linear-gradient(135deg,#ff8c00,#ff4500);
    padding: 25px 20px;
    text-align: center;
}

header h1 {
    margin: 0;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 20px;
}

.card {
    background: #1c1c1c;
    border-radius: 15px;
    padding: 18px;
    margin: 15px 0;
    border: 1px solid #333;
}

.card h2 {
    color: orange;
}

.info {
    line-height: 1.8;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    border: none;
    border-radius: 9px;
    background: orange;
    color: black;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #ffb000;
}

input {
    width: 100%;
    padding: 13px;
    margin: 7px 0;
    border: none;
    border-radius: 8px;
}

.box {
    background: #202020;
    padding: 18px;
    border-radius: 15px;
    margin-bottom: 20px;
}

.hidden {
    display: none;
}

.message {
    text-align: center;
    margin-top: 10px;
}

.room {
    background: #102b18;
    border: 1px solid #00c853;
    padding: 12px;
    border-radius: 10px;
    margin-top: 12px;
}

.room b {
    color: #00ff88;
}

.logout {
    background: #444;
    color: white;
}

.completed-title {
    color: #ff5555;
    text-align: center;
    margin-top: 40px;
}

.completed-card {
    opacity: .7;
}

.empty {
    text-align: center;
    color: #aaa;
    padding: 25px;
}

.small {
    color: #aaa;
    font-size: 14px;
}


/* =========================
   FULL MAP RULES
========================= */

.rulesSection {
    margin-top: 15px;
}

.rulesButton {
    background: #292929;
    color: #ff9d00;
    border: 1px solid #ff6a00;
}

.rulesButton:hover {
    background: #353535;
}

.rulesContent {
    display: none;
    background: #151515;
    border: 1px solid #555;
    border-radius: 10px;
    padding: 14px;
    margin-top: 10px;
    line-height: 1.7;
    white-space: normal;
}

.rulesContent.show {
    display: block;
}

.rulesTitle {
    color: #ff9d00;
    margin-top: 0;
}

.noRules {
    color: #888;
    font-size: 14px;
}

</style>

</head>

<body>

<header>

<h1>🔥 FF Tournament Hub</h1>

<p>Free Fire Tournaments • Join & Play</p>

</header>


<div class="container">


<!-- ACCOUNT -->

<div class="box">

<div id="loggedOut">

<h2>👤 Player Account</h2>

<button onclick="showLogin()">
🔐 Login
</button>

<button onclick="showSignup()">
📝 Create Account
</button>

</div>


<div id="loggedIn"
class="hidden">

<h2>👤 My Account</h2>

<p id="accountInfo"></p>

<button class="logout"
onclick="logout()">
🚪 Logout
</button>

</div>

</div>


<!-- LOGIN -->

<div id="loginBox"
class="box hidden">

<h2>🔐 Login</h2>

<input id="loginValue"
placeholder="Username or Email">

<input id="loginPassword"
type="password"
placeholder="Password">

<button onclick="login()">
Login
</button>

<p id="loginMsg"
class="message"></p>

</div>


<!-- SIGNUP -->

<div id="signupBox"
class="box hidden">

<h2>📝 Create Account</h2>

<input id="signupUsername"
placeholder="Username">

<input id="signupEmail"
type="email"
placeholder="Email">

<input id="signupPassword"
type="password"
placeholder="Password">

<input id="signupConfirm"
type="password"
placeholder="Confirm Password">

<input id="signupUid"
placeholder="Free Fire UID">

<button onclick="signup()">
Create Account
</button>

<p id="signupMsg"
class="message"></p>

</div>


<h2 style="text-align:center;">
🏆 Upcoming Tournaments
</h2>

<div id="upcomingTournaments">

<div class="empty">
Loading tournaments...
</div>

</div>


<h2 class="completed-title">
🔴 Completed Tournaments
</h2>

<div id="completedTournaments">

<div class="empty">
Loading...
</div>

</div>


</div>


<script>

let currentUser = null;


function parseTournamentDate(dateString) {

    if (!dateString) return null;


    const parts =
        dateString.trim().split(" ");


    if (parts.length < 2) return null;


    const dateParts =
        parts[0].includes("/")
        ? parts[0].split("/")
        : parts[0].split("-");


    const timeParts =
        parts[1].split(":");


    if (
        dateParts.length !== 3 ||
        timeParts.length !== 2
    ) {
        return null;
    }


    const day =
        Number(dateParts[0]);


    const month =
        Number(dateParts[1]) - 1;


    const year =
        2000 + Number(dateParts[2]);


    return new Date(
        year,
        month,
        day,
        Number(timeParts[0]),
        Number(timeParts[1])
    );
}


function showLogin() {

    document.getElementById("loginBox")
        .classList.remove("hidden");


    document.getElementById("signupBox")
        .classList.add("hidden");
}


function showSignup() {

    document.getElementById("signupBox")
        .classList.remove("hidden");


    document.getElementById("loginBox")
        .classList.add("hidden");
}


async function checkUser() {

    const response =
        await fetch(
            "/api/auth/me"
        );


    const data =
        await response.json();


    if (data.logged_in) {

        currentUser = data.user;


        document.getElementById("loggedOut")
            .classList.add("hidden");


        document.getElementById("loggedIn")
            .classList.remove("hidden");


        document.getElementById("loginBox")
            .classList.add("hidden");


        document.getElementById("signupBox")
            .classList.add("hidden");


        document.getElementById("accountInfo")
            .innerHTML =
            `<b>${escapeHTML(data.user.username)}</b><br>
             UID: ${escapeHTML(data.user.uid)}<br>
             Email: ${escapeHTML(data.user.email)}`;

    } else {

        currentUser = null;


        document.getElementById("loggedOut")
            .classList.remove("hidden");


        document.getElementById("loggedIn")
            .classList.add("hidden");
    }


    loadTournaments();
}


async function signup() {

    const username =
        document.getElementById(
            "signupUsername"
        ).value.trim();


    const email =
        document.getElementById(
            "signupEmail"
        ).value.trim();


    const password =
        document.getElementById(
            "signupPassword"
        ).value;


    const confirm =
        document.getElementById(
            "signupConfirm"
        ).value;


    const uid =
        document.getElementById(
            "signupUid"
        ).value.trim();


    const msg =
        document.getElementById(
            "signupMsg"
        );


    if (
        !username ||
        !email ||
        !password ||
        !confirm ||
        !uid
    ) {

        msg.innerText =
            "❌ Sabhi fields bharo.";

        return;
    }


    msg.innerText =
        "⏳ Creating account...";


    const response =
        await fetch(
            "/api/auth/signup",
            {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    username: username,

                    email: email,

                    password: password,

                    confirm_password:
                        confirm,

                    uid: uid
                })
            }
        );


    const data =
        await response.json();


    if (data.success) {

        msg.innerText =
            "✅ Account created!";


        checkUser();

    } else {

        msg.innerText =
            "❌ " + data.message;
    }
}


async function login() {

    const loginValue =
        document.getElementById(
            "loginValue"
        ).value.trim();


    const password =
        document.getElementById(
            "loginPassword"
        ).value;


    const msg =
        document.getElementById(
            "loginMsg"
        );


    msg.innerText =
        "⏳ Logging in...";


    const response =
        await fetch(
            "/api/auth/login",
            {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    identifier:
                        loginValue,

                    password:
                        password
                })
            }
        );


    const data =
        await response.json();


    if (data.success) {

        msg.innerText =
            "✅ Login successful!";


        checkUser();

    } else {

        msg.innerText =
            "❌ " + data.message;
    }
}


async function logout() {

    await fetch(
        "/api/auth/logout"
    );


    currentUser = null;

    checkUser();
}


function escapeHTML(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function formatRules(rules) {

    if (!rules || !rules.trim()) {

        return `
            <p class="noRules">
                📜 Is tournament ke rules abhi add nahi kiye gaye.
            </p>
        `;
    }


    return escapeHTML(rules)
        .replace(/\r?\n/g, "<br>");
}


function toggleRules(id) {

    const box =
        document.getElementById(
            `rules-content-${id}`
        );


    if (!box) return;


    box.classList.toggle("show");


    const button =
        document.getElementById(
            `rules-button-${id}`
        );


    if (
        button &&
        box.classList.contains("show")
    ) {

        button.innerText =
            "📕 Hide Full Map Rules";

    } else if (button) {

        button.innerText =
            "📜 Full Map Rules";
    }
}


function rulesHTML(t) {

    return `

        <div class="rulesSection">

            <button
            id="rules-button-${t.id}"
            class="rulesButton"
            onclick="toggleRules(${t.id})">

            📜 Full Map Rules

            </button>

            <div
            id="rules-content-${t.id}"
            class="rulesContent">

                <h3 class="rulesTitle">
                    📜 Full Map Rules
                </h3>

                ${formatRules(t.rules)}

            </div>

        </div>
    `;
}


async function loadTournaments() {

    try {

        const response =
            await fetch(
                "/api/tournaments"
            );


        const tournaments =
            await response.json();


        const upcomingBox =
            document.getElementById(
                "upcomingTournaments"
            );


        const completedBox =
            document.getElementById(
                "completedTournaments"
            );


        upcomingBox.innerHTML = "";
        completedBox.innerHTML = "";


        const now =
            new Date();


        let upcomingCount = 0;
        let completedCount = 0;


        tournaments.forEach(t => {

            const tournamentDate =
                parseTournamentDate(
                    t.date_time
                );


            if (!tournamentDate) return;


            const playerCount =
                t.players.length;


            const available =
                t.max_players -
                playerCount;


            let actionHTML = "";


            if (!currentUser) {

                actionHTML = `

                    <button
                    onclick="showLogin()">

                    🔐 Login to Join

                    </button>
                `;

            } else if (t.registered) {

                actionHTML = `

                    <button disabled>

                    ✅ Already Registered

                    </button>
                `;


                if (t.room_id) {

                    actionHTML += `

                    <div class="room">

                        🎮 <b>Room ID:</b>
                        ${escapeHTML(t.room_id)}

                        <br>

                        🔐 <b>Password:</b>
                        ${escapeHTML(t.room_password)}

                    </div>
                    `;

                } else {

                    actionHTML += `

                    <p class="small">

                    ⏳ Room details abhi admin ne add nahi kiye.

                    </p>
                    `;
                }

            } else if (available > 0) {

                actionHTML = `

                    <button
                    onclick="showForm(${t.id})">

                    📝 Join Tournament

                    </button>


                    <div
                    id="form-${t.id}"
                    class="box hidden">

                        <h3>
                        👤 Player Registration
                        </h3>


                        <input
                        id="name-${t.id}"
                        placeholder="Player Name">


                        <input
                        id="uid-${t.id}"
                        value="${escapeHTML(currentUser.uid)}"
                        readonly>


                        <button
                        onclick="registerPlayer(${t.id})">

                        ✅ Register Now

                        </button>


                        <p
                        id="message-${t.id}"
                        class="message">

                        </p>

                    </div>
                `;

            } else {

                actionHTML = `

                    <button disabled>

                    ❌ Tournament Full

                    </button>
                `;
            }


            const card = `

                <div class="card">

                    <h2>
                        🎮 ${escapeHTML(t.name)}
                    </h2>


                    <div class="info">

                        💰 Entry Fee:
                        ${t.entry_fee} Tokens

                        <br>

                        🏆 1st Prize:
                        ₹${t.first_prize}

                        <br>

                        🎯 Per Kill:
                        ₹${t.kill_reward}

                        <br>

                        👥 Slots:
                        ${playerCount}/${t.max_players}

                        <br>

                        🟢 Available:
                        ${available}

                        <br>

                        📅 Date:
                        ${escapeHTML(t.date_time)}

                    </div>


                    ${rulesHTML(t)}


                    ${actionHTML}

                </div>
            `;


            if (tournamentDate > now) {

                upcomingBox.innerHTML += card;

                upcomingCount++;

            } else {

                completedBox.innerHTML += `

                    <div class="card completed-card">

                        <h2>
                        🎮 ${escapeHTML(t.name)}
                        </h2>


                        <div class="info">

                            💰 Entry:
                            ${t.entry_fee} Tokens

                            <br>

                            🏆 1st Prize:
                            ₹${t.first_prize}

                            <br>

                            👥 Players:
                            ${playerCount}/${t.max_players}

                            <br>

                            📅 Date:
                            ${escapeHTML(t.date_time)}

                            <br>

                            🔴 Status:
                            Tournament Completed

                        </div>


                        ${rulesHTML(t)}

                    </div>
                `;


                completedCount++;
            }

        });


        if (upcomingCount === 0) {

            upcomingBox.innerHTML = `

                <div class="empty">

                    😔 Abhi koi upcoming tournament nahi hai.

                </div>
            `;
        }


        if (completedCount === 0) {

            completedBox.innerHTML = `

                <div class="empty">

                    Abhi koi completed tournament nahi hai.

                </div>
            `;
        }

    } catch (error) {

        document.getElementById(
            "upcomingTournaments"
        ).innerHTML = `

            <div class="empty">

                ❌ Tournaments load nahi ho paaye.

            </div>
        `;
    }
}


function showForm(id) {

    const form =
        document.getElementById(
            `form-${id}`
        );


    if (form) {

        form.classList.toggle(
            "hidden"
        );
    }
}


async function registerPlayer(id) {

    const name =
        document.getElementById(
            `name-${id}`
        ).value.trim();


    const uid =
        document.getElementById(
            `uid-${id}`
        ).value.trim();


    const message =
        document.getElementById(
            `message-${id}`
        );


    if (!name) {

        message.innerText =
            "❌ Player Name bharo.";

        return;
    }


    message.innerText =
        "⏳ Registering...";


    const response =
        await fetch(
            `/api/tournaments/${id}/players`,
            {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    name: name,

                    uid: uid
                })
            }
        );


    const data =
        await response.json();


    if (data.success) {

        message.innerText =
            "✅ Registration successful!";


        setTimeout(
            loadTournaments,
            700
        );

    } else {

        message.innerText =
            "❌ " + data.message;
    }
}


checkUser();

</script>

</body>

</html>
