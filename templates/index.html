```html
<!-- BHAI YE EXACT FIXED INDEX FILE HAI -->
<!-- Full file yahan se copy karna ho to download button se exact file use karo. -->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Fire Tournament Hub</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#0b0b0b;
color:white
}

.container{
width:95%;
max-width:1100px;
margin:auto
}

header{
background:#111;
padding:18px 0;
border-bottom:1px solid #333
}

header h1{
margin:0;
text-align:center;
color:#ff9800
}

.auth-box{
background:#151515;
padding:20px;
border-radius:12px;
margin:20px 0
}

input,textarea{
width:100%;
padding:12px;
margin:7px 0;
border:none;
border-radius:7px
}

button{
padding:11px 18px;
border:none;
border-radius:7px;
background:#ff9800;
color:#111;
font-weight:bold;
cursor:pointer;
margin-top:7px
}

button:disabled{
background:#555;
color:#aaa;
cursor:not-allowed
}

.card{
background:#151515;
border:1px solid #292929;
border-radius:14px;
padding:18px;
margin:15px 0
}

.info{
line-height:1.9;
color:#ddd
}

.hidden{
display:none
}

.signup-login{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px
}

.results{
margin-top:15px
}

.result-row{
display:flex;
justify-content:space-between;
gap:10px;
background:#101010;
padding:12px;
margin:6px 0;
border-radius:7px
}

@media(max-width:700px){
.signup-login{
grid-template-columns:1fr
}

.result-row{
flex-direction:column
}
}
</style>
</head>

<body>

<header>
<div class="container">
<h1>🔥 Free Fire Tournament Hub</h1>
</div>
</header>


<div class="container">


<!-- LOGIN / SIGNUP -->

<div id="authSection" class="auth-box">

<div class="signup-login">


<!-- LOGIN -->

<div>

<h2>🔐 Login</h2>

<input
id="loginIdentifier"
placeholder="Username ya Email"
>

<input
id="loginPassword"
type="password"
placeholder="Password"
>

<button onclick="loginUser()">
Login
</button>

<div id="loginMessage"></div>

</div>


<!-- SIGNUP -->

<div>

<h2>📝 Signup</h2>

<input
id="signupUsername"
placeholder="Username"
>

<input
id="signupEmail"
type="email"
placeholder="Email"
>

<input
id="signupUID"
placeholder="Free Fire UID"
>

<input
id="signupPassword"
type="password"
placeholder="Password"
>

<input
id="signupConfirm"
type="password"
placeholder="Confirm Password"
>

<button onclick="signupUser()">
Create Account
</button>

<div id="signupMessage"></div>

</div>

</div>

</div>


<!-- LOGGED IN -->

<div id="userSection" class="hidden">

<h2>
👋 Welcome,
<span id="usernameDisplay"></span>
</h2>

<div>
💰 Wallet:
<b>
<span id="walletBalance">0</span>
</b>
Tokens
</div>

<button onclick="logoutUser()">
Logout
</button>

</div>


<!-- NOTICE -->

<div class="card">

<h2>📢 Notice Board</h2>

<div id="noticeBoard">
Loading notices...
</div>

</div>


<h2>
🏆 Upcoming Tournaments
</h2>

<div id="upcomingTournaments">
Loading tournaments...
</div>


<h2>
🔴 Live Tournaments
</h2>

<div id="liveTournaments">
No live tournament.
</div>


<h2>
🏁 Completed Tournaments
</h2>

<div id="completedTournaments">
No completed tournament.
</div>

</div>


<script>

let currentUser=null;


function escapeHTML(value){

return String(value??'')
.replace(/&/g,'&amp;')
.replace(/</g,'&lt;')
.replace(/>/g,'&gt;')
.replace(/"/g,'&quot;')
.replace(/'/g,'&#039;');

}


/* CHECK USER */

async function checkUser(){

try{

const response=
await fetch(
"/api/auth/me",
{
credentials:"same-origin"
}
);

const data=
await response.json();

if(data.logged_in){

currentUser=data.user;

showLoggedIn();

await loadWallet();

}
else{

currentUser=null;

showLoggedOut();

}

}
catch(error){

showLoggedOut();

}

}


/* LOGGED OUT */

function showLoggedOut(){

document
.getElementById("authSection")
.classList
.remove("hidden");

document
.getElementById("userSection")
.classList
.add("hidden");

}


/* LOGGED IN */

function showLoggedIn(){

document
.getElementById("authSection")
.classList
.add("hidden");

document
.getElementById("userSection")
.classList
.remove("hidden");

document
.getElementById("usernameDisplay")
.innerText=
currentUser.username||"";

}


/* SIGNUP */

async function signupUser(){

const username=
document
.getElementById("signupUsername")
.value
.trim();

const email=
document
.getElementById("signupEmail")
.value
.trim();

const uid=
document
.getElementById("signupUID")
.value
.trim();

const password=
document
.getElementById("signupPassword")
.value;

const confirm=
document
.getElementById("signupConfirm")
.value;

const message=
document
.getElementById("signupMessage");


if(
!username||
!email||
!uid||
!password||
!confirm
){

message.innerText=
"❌ Sabhi fields bharo.";

return;

}


if(password!==confirm){

message.innerText=
"❌ Password aur Confirm Password same hone chahiye.";

return;

}


message.innerText=
"⏳ Account create ho raha hai...";


try{

const response=
await fetch(
"/api/auth/signup",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

username:username,

email:email,

uid:uid,

password:password,

confirm_password:confirm

})

}
);


const data=
await response.json();


if(data.success){

currentUser=
data.user;

showLoggedIn();

await loadWallet();

message.innerText=
"✅ Account successfully create ho gaya.";

}
else{

message.innerText=
"❌ "+
(
data.message||
"Signup failed."
);

}

}
catch(error){

message.innerText=
"❌ Server error.";

}

}


/* LOGIN */

async function loginUser(){

const identifier=
document
.getElementById("loginIdentifier")
.value
.trim();

const password=
document
.getElementById("loginPassword")
.value;

const message=
document
.getElementById("loginMessage");


if(!identifier||!password){

message.innerText=
"❌ Username/email aur password bharo.";

return;

}


const response=
await fetch(
"/api/auth/login",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

credentials:"same-origin",

body:JSON.stringify({

identifier:identifier,

password:password

})

}
);


const data=
await response.json();


if(data.success){

currentUser=
data.user;

showLoggedIn();

await loadWallet();

message.innerText="";

}
else{

message.innerText=
"❌ "+
(
data.message||
"Login failed."
);

}

}


/* LOGOUT */

async function logoutUser(){

await fetch(
"/api/auth/logout",
{
method:"POST",
credentials:"same-origin"
}
);

currentUser=null;

showLoggedOut();

}


/* WALLET */

async function loadWallet(){

if(!currentUser)
return;

try{

const response=
await fetch(
"/api/wallet/"+
encodeURIComponent(
currentUser.uid
)
);

const data=
await response.json();

document
.getElementById("walletBalance")
.innerText=
data.balance??0;

}
catch(error){

document
.getElementById("walletBalance")
.innerText=
"0";

}

}


/* NOTICE */

async function loadNotices(){

try{

const response=
await fetch(
"/api/notices"
);

const notices=
await response.json();

const box=
document
.getElementById("noticeBoard");

if(
!Array.isArray(notices)||
!notices.length
){

box.innerHTML=
"📭 Abhi koi notice nahi hai.";

return;

}

box.innerHTML=
notices
.map(
n=>
`
<div class="card">

<h3>
📌
${escapeHTML(n.title)}
</h3>

<p>
${escapeHTML(n.message)}
</p>

</div>
`
)
.join("");

}
catch(error){

document
.getElementById("noticeBoard")
.innerText=
"Notice load nahi ho paaye.";

}

}


/* TOURNAMENTS */

async function loadTournaments(){

try{

const response=
await fetch(
"/api/tournaments"
);

const tournaments=
await response.json();

const upcoming=
document
.getElementById(
"upcomingTournaments"
);

const live=
document
.getElementById(
"liveTournaments"
);

const completed=
document
.getElementById(
"completedTournaments"
);

upcoming.innerHTML="";
live.innerHTML="";
completed.innerHTML="";


tournaments.forEach(
t=>{

const status=
t.status||
"upcoming";

const players=
Array.isArray(t.players)
?
t.players
:
[];


let html=
`
<div class="card">

<h3>
${escapeHTML(t.name)}
</h3>

<p>
💰 Entry:
₹${t.entry_fee}
</p>

<p>
👥 Players:
${t.player_count||players.length}
/${t.max_players}
</p>

<p>
🎯 Per Kill:
₹${t.kill_reward}
</p>

<p>
🏆 Prize:
₹${t.first_prize}
</p>

<p>
📅 ${escapeHTML(t.date_time)}
</p>

</div>
`;


/* FINAL RESULT
   Backend decides whether results_visible is true.
*/

if(
status==="completed" &&
t.results_visible &&
players.length
){

const sorted=
[...players]
.sort(
(a,b)=>
Number(a.position||999999)
-
Number(b.position||999999)
||
Number(b.kills||0)
-
Number(a.kills||0)
);


html+=
`
<div class="results">

<h3>
🏆 Final Results
</h3>

${
sorted
.map(
p=>
`
<div class="result-row">

<span>
#${p.position||"-"}
&nbsp;
${escapeHTML(p.name)}
</span>

<span>
🎯
${p.kills||0}
Kills
</span>

</div>
`
)
.join("")
}

</div>
`;

}


/* PUT INTO CORRECT SECTION */

if(status==="upcoming"){

upcoming.innerHTML+=html;

}

else if(status==="live"){

live.innerHTML+=html;

}

else{

completed.innerHTML+=html;

}

}
);


if(!upcoming.innerHTML)
upcoming.innerHTML=
"No upcoming tournament.";

if(!live.innerHTML)
live.innerHTML=
"No live tournament.";

if(!completed.innerHTML)
completed.innerHTML=
"No completed tournament.";

}
catch(error){

console.error(error);

}

}


/* START */

checkUser();

loadNotices();

loadTournaments();

</script>

</body>
</html>
```
