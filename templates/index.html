<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FF Tournament Hub</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0d0d0d;
            color: white;
        }

        header {
            background: linear-gradient(135deg, #ff8c00, #ff4500);
            padding: 25px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            margin: 8px 0 0;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 20px;
        }

        .title {
            text-align: center;
            margin: 20px 0;
        }

        .card {
            background: #1c1c1c;
            border-radius: 15px;
            padding: 18px;
            margin: 15px 0;
            border: 1px solid #333;
        }

        .card h2 {
            margin-top: 0;
            color: orange;
        }

        .info {
            line-height: 1.8;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            border: none;
            border-radius: 9px;
            background: orange;
            color: black;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #ffb000;
        }

        .form-box {
            display: none;
            background: #242424;
            padding: 18px;
            border-radius: 15px;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 8px 0;
            border: none;
            border-radius: 8px;
        }

        .message {
            text-align: center;
            margin-top: 10px;
        }

        .empty {
            text-align: center;
            color: #aaa;
            padding: 30px;
        }

        .completed-title {
            color: #ff5555;
            text-align: center;
            margin-top: 40px;
        }

        .completed-card {
            opacity: 0.75;
        }

        .completed-card h2 {
            color: #999;
        }

    </style>

</head>

<body>

<header>

    <h1>🔥 FF Tournament Hub</h1>

    <p>Free Fire Tournaments • Join & Play</p>

</header>


<div class="container">

    <h2 class="title">🏆 Upcoming Tournaments</h2>

    <div id="upcomingTournaments">

        <div class="empty">
            Loading tournaments...
        </div>

    </div>


    <h2 class="completed-title">
        🔴 Completed Tournaments
    </h2>

    <div id="completedTournaments">

        <div class="empty">
            Loading...
        </div>

    </div>

</div>


<script>


function parseTournamentDate(dateString) {

    if (!dateString) {
        return null;
    }

    /*
        Expected format:
        DD/MM/YY HH:MM

        Example:
        24/09/26 12:00
    */

    const parts = dateString.trim().split(" ");

    if (parts.length < 2) {
        return null;
    }

    const dateParts = parts[0].split("/");
    const timeParts = parts[1].split(":");

    if (dateParts.length !== 3 || timeParts.length !== 2) {
        return null;
    }

    const day = Number(dateParts[0]);
    const month = Number(dateParts[1]) - 1;
    const year = 2000 + Number(dateParts[2]);

    const hour = Number(timeParts[0]);
    const minute = Number(timeParts[1]);

    const date = new Date(
        year,
        month,
        day,
        hour,
        minute
    );

    return date;
}


async function loadTournaments() {

    try {

        const response =
            await fetch("/api/tournaments");

        const tournaments =
            await response.json();


        const upcomingBox =
            document.getElementById(
                "upcomingTournaments"
            );

        const completedBox =
            document.getElementById(
                "completedTournaments"
            );


        upcomingBox.innerHTML = "";
        completedBox.innerHTML = "";


        const now = new Date();


        let upcomingCount = 0;
        let completedCount = 0;


        tournaments.forEach(t => {

            const tournamentDate =
                parseTournamentDate(t.date_time);


            /*
                Agar date invalid hai to tournament
                ko upcoming me nahi daalenge.
            */

            if (!tournamentDate) {
                return;
            }


            const available =
                t.max_players - t.players.length;


            const tournamentCard = `

                <div class="card">

                    <h2>🎮 ${t.name}</h2>

                    <div class="info">

                        💰 Entry Fee:
                        ₹${t.entry_fee}

                        <br>

                        🏆 1st Prize:
                        ₹${t.first_prize}

                        <br>

                        🎯 Per Kill:
                        ₹${t.kill_reward}

                        <br>

                        👥 Slots:
                        ${t.players.length}/${t.max_players}

                        <br>

                        🟢 Available:
                        ${available}

                        <br>

                        📅 Date:
                        ${t.date_time}

                    </div>


                    ${
                        available > 0

                        ? `

                            <button
                                onclick="showForm(${t.id})"
                            >
                                📝 Join Tournament
                            </button>


                            <div
                                class="form-box"
                                id="form-${t.id}"
                            >

                                <h3>
                                    👤 Player Registration
                                </h3>


                                <input
                                    id="name-${t.id}"
                                    placeholder="Player Name"
                                >


                                <input
                                    id="uid-${t.id}"
                                    placeholder="Free Fire UID"
                                >


                                <button
                                    onclick="registerPlayer(${t.id})"
                                >
                                    ✅ Register Now
                                </button>


                                <div
                                    class="message"
                                    id="message-${t.id}"
                                ></div>

                            </div>

                        `

                        : `

                            <button disabled>
                                ❌ Tournament Full
                            </button>

                        `
                    }

                </div>

            `;


            /*
                FUTURE = UPCOMING
                PAST = COMPLETED
            */

if (tournamentDate > now) {

    upcomingBox.innerHTML += tournamentCard;
    upcomingCount++;

} else {

    const completedCard = `
        <div class="card completed-card">

            <h2>🎮 ${t.name}</h2>

            <div class="info">

                💰 Entry Fee:
                ₹${t.entry_fee}

                <br>

                🏆 1st Prize:
                ₹${t.first_prize}

                <br>

                🎯 Per Kill:
                ₹${t.kill_reward}

                <br>

                👥 Players:
                ${t.players.length}/${t.max_players}

                <br>

                📅 Date:
                ${t.date_time}

                <br>

                🔴 Status:
                Tournament Completed

            </div>

        </div>
    `;

    completedBox.innerHTML += completedCard;
    completedCount++;

}
        });


        if (upcomingCount === 0) {

            upcomingBox.innerHTML = `

                <div class="empty">

                    😔 Abhi koi upcoming tournament nahi hai.

                </div>

            `;

        }


        if (completedCount === 0) {

            completedBox.innerHTML = `

                <div class="empty">

                    Abhi koi completed tournament nahi hai.

                </div>

            `;

        }

    }

    catch (error) {

        document.getElementById(
            "upcomingTournaments"
        ).innerHTML = `

            <div class="empty">

                ❌ Tournaments load nahi ho paaye.

            </div>

        `;

    }

}


function showForm(id) {

    const form =
        document.getElementById(
            `form-${id}`
        );


    if (form.style.display === "block") {

        form.style.display = "none";

    }

    else {

        form.style.display = "block";

    }

}


async function registerPlayer(id) {

    const name =
        document.getElementById(
            `name-${id}`
        ).value.trim();


    const uid =
        document.getElementById(
            `uid-${id}`
        ).value.trim();


    const message =
        document.getElementById(
            `message-${id}`
        );


    if (!name || !uid) {

        message.innerText =
            "❌ Name aur UID dono bharo.";

        return;

    }


    message.innerText =
        "⏳ Registering...";


    try {

        const response = await fetch(

            `/api/tournaments/${id}/players`,

            {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    name: name,
                    uid: uid

                })

            }

        );


        const data =
            await response.json();


        if (data.success) {

            message.innerText =
                "✅ Registration successful!";


            document.getElementById(
                `name-${id}`
            ).value = "";


            document.getElementById(
                `uid-${id}`
            ).value = "";


            setTimeout(
                loadTournaments,
                1000
            );

        }

        else {

            message.innerText =
                "❌ " + data.message;

        }

    }

    catch (error) {

        message.innerText =
            "❌ Something went wrong.";

    }

}


loadTournaments();


</script>

</body>

</html>
