<!DOCTYPE html>
<html>
<head>
    <title>FF Tournament Hub - Admin</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        header {
            background: #ff6a00;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 20px;
        }

        .box {
            background: #1c1c1c;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 12px;
        }

        input, select, button {
            padding: 10px;
            margin: 5px;
            border-radius: 6px;
            border: none;
        }

        button {
            background: #ff6a00;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #ff8500;
        }

        .tournament {
            background: #252525;
            padding: 15px;
            margin-top: 15px;
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #444;
            text-align: center;
        }

        th {
            background: #ff6a00;
        }

        .login {
            max-width: 400px;
            margin: 60px auto;
            text-align: center;
        }

        .hidden {
            display: none;
        }

        .profit {
            color: #00ff88;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>👑 FF Tournament Admin</h1>
</header>

<div class="container">

    <!-- LOGIN -->
    <div id="loginBox" class="box login">

        <h2>🔐 Admin Login</h2>

        <input
            type="text"
            id="username"
            placeholder="Username"
        >

        <br>

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <br>

        <button onclick="login()">
            Login
        </button>

        <p id="loginMsg"></p>

    </div>


    <!-- DASHBOARD -->
    <div id="dashboard" class="hidden">

        <div class="box">

            <h2>📊 Dashboard</h2>

            <button onclick="loadTournaments()">
                🔄 Refresh
            </button>

            <button onclick="logout()">
                🚪 Logout
            </button>

        </div>


        <!-- CREATE TOURNAMENT -->

        <div class="box">

            <h2>➕ Create Tournament</h2>

            <input
                id="tName"
                placeholder="Tournament Name"
            >

            <input
                id="entryFee"
                type="number"
                placeholder="Entry Fee"
            >

            <input
                id="maxPlayers"
                type="number"
                placeholder="Max Players"
            >

            <input
                id="killReward"
                type="number"
                placeholder="Per Kill Reward"
            >

            <input
                id="firstPrize"
                type="number"
                placeholder="1st Prize"
            >

            <input
                id="dateTime"
                type="text"
                placeholder="Date & Time"
            >

            <br>

            <button onclick="createTournament()">
                Create Tournament
            </button>

            <p id="createMsg"></p>

        </div>


        <!-- TOURNAMENTS -->

        <div class="box">

            <h2>🏆 Tournaments</h2>

            <div id="tournaments"></div>

        </div>

    </div>

</div>


<script>

async function login() {

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;


    const response = await fetch("/admin-login", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            username: username,
            password: password
        })

    });


    const data = await response.json();


    if (data.success) {

        document.getElementById("loginBox")
            .classList.add("hidden");

        document.getElementById("dashboard")
            .classList.remove("hidden");

        loadTournaments();

    } else {

        document.getElementById("loginMsg")
            .innerText = data.message;

    }

}


async function logout() {

    await fetch("/admin-logout");

    location.reload();

}


async function createTournament() {

    const data = {

        name:
            document.getElementById("tName").value,

        entry_fee:
            document.getElementById("entryFee").value,

        max_players:
            document.getElementById("maxPlayers").value,

        kill_reward:
            document.getElementById("killReward").value,

        first_prize:
            document.getElementById("firstPrize").value,

        date_time:
            document.getElementById("dateTime").value

    };


    const response = await fetch(
        "/api/tournaments",
        {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(data)
        }
    );


    const result = await response.json();


    if (result.success) {

        document.getElementById("createMsg")
            .innerText =
            "✅ Tournament created!";

        loadTournaments();

    } else {

        document.getElementById("createMsg")
            .innerText =
            result.message;

    }

}


async function loadTournaments() {

    const response =
        await fetch("/api/tournaments");

    const tournaments =
        await response.json();


    const container =
        document.getElementById("tournaments");

    container.innerHTML = "";


    tournaments.forEach(t => {

        const revenue =
            t.players.length * t.entry_fee;

        const prizePool =
            t.first_prize;

        const profit =
            revenue - prizePool;


        let playersHTML = "";


        if (t.players.length > 0) {

            playersHTML = `

                <h3>👥 Players</h3>

                <table>

                    <tr>
                        <th>Player</th>
                        <th>UID</th>
                        <th>Kills</th>
                        <th>Position</th>
                        <th>Kill Reward</th>
                    </tr>

                    ${t.players.map(p => `

                        <tr>

                            <td>${p.name}</td>

                            <td>${p.uid}</td>

                            <td>
                                <input
                                    type="number"
                                    value="${p.kills || 0}"
                                    style="width:70px"
                                >
                            </td>

                            <td>
                                <input
                                    type="number"
                                    value="${p.position || 0}"
                                    style="width:70px"
                                >
                            </td>

                            <td>
                                ₹${(p.kills || 0) * t.kill_reward}
                            </td>

                        </tr>

                    `).join("")}

                </table>

            `;

        } else {

            playersHTML =
                "<p>Abhi koi player registered nahi hai.</p>";

        }


        container.innerHTML += `

            <div class="tournament">

                <h2>🏆 ${t.name}</h2>

                <p>
                    💰 Entry: ₹${t.entry_fee}
                </p>

                <p>
                    👥 Players:
                    ${t.players.length}/${t.max_players}
                </p>

                <p>
                    🗡️ Per Kill:
                    ₹${t.kill_reward}
                </p>

                <p>
                    🥇 1st Prize:
                    ₹${t.first_prize}
                </p>

                <p>
                    📅 ${t.date_time}
                </p>

                <hr>

                <p>
                    💵 Revenue:
                    ₹${revenue}
                </p>

                <p>
                    🎁 Prize:
                    ₹${prizePool}
                </p>

                <p class="profit">
                    📈 Current Profit:
                    ₹${profit}
                </p>

                ${playersHTML}

            </div>

        `;

    });

}

</script>

</body>
</html>
