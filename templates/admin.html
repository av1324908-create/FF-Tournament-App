<!DOCTYPE html>
<html>

<head>

<title>FF Tournament Hub - Admin</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
}

header {
    background: #ff6a00;
    padding: 20px;
    text-align: center;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.box {
    background: #1c1c1c;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 12px;
}

input, button {
    padding: 10px;
    margin: 5px;
    border-radius: 6px;
    border: none;
}

input {
    min-width: 180px;
}

button {
    background: #ff6a00;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #ff8500;
}

.deleteBtn {
    background: #d40000;
}

.deleteBtn:hover {
    background: #ff2222;
}

.saveBtn {
    background: #00a86b;
}

.hidden {
    display: none;
}

.login {
    max-width: 400px;
    margin: 60px auto;
    text-align: center;
}

.tournament {
    background: #252525;
    padding: 18px;
    margin-top: 15px;
    border-radius: 10px;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

th, td {
    padding: 10px;
    border-bottom: 1px solid #444;
    text-align: center;
}

th {
    background: #ff6a00;
}

.profit {
    color: #00ff88;
    font-weight: bold;
}

.roomBox {
    background: #162016;
    border: 1px solid #00a86b;
    padding: 15px;
    border-radius: 10px;
    margin-top: 15px;
}

</style>

</head>

<body>

<header>

<h1>👑 FF Tournament Admin</h1>

</header>


<div class="container">


<!-- LOGIN -->

<div id="loginBox"
class="box login">

<h2>🔐 Admin Login</h2>

<input
type="text"
id="username"
placeholder="Username">

<br>

<input
type="password"
id="password"
placeholder="Password">

<br>

<button onclick="login()">
Login
</button>

<p id="loginMsg"></p>

</div>


<!-- DASHBOARD -->

<div id="dashboard"
class="hidden">


<div class="box">

<h2>📊 Dashboard</h2>

<button onclick="loadTournaments()">
🔄 Refresh
</button>

<button onclick="logout()">
🚪 Logout
</button>

</div>


<!-- CREATE -->

<div class="box">

<h2>➕ Create Tournament</h2>

<input
id="tName"
placeholder="Tournament Name">

<input
id="entryFee"
type="number"
placeholder="Entry Fee">

<input
id="maxPlayers"
type="number"
placeholder="Max Players">

<input
id="killReward"
type="number"
placeholder="Per Kill Reward">

<input
id="firstPrize"
type="number"
placeholder="1st Prize">

<input
id="dateTime"
placeholder="24/09/26 13:00">

<br>

<button onclick="createTournament()">
Create Tournament
</button>

<p id="createMsg"></p>

</div>


<!-- PASSWORD -->

<div class="box">

<h2>🔑 Change Admin Password</h2>

<input
id="currentPassword"
type="password"
placeholder="Current Password">

<input
id="newPassword"
type="password"
placeholder="New Password">

<input
id="confirmPassword"
type="password"
placeholder="Confirm New Password">

<br>

<button onclick="changePassword()">
Change Password
</button>

<p id="passwordMsg"></p>

</div>


<!-- TOURNAMENTS -->

<div class="box">

<h2>🏆 Tournaments</h2>

<div id="tournaments">
Loading...
</div>

</div>


<!-- WALLET -->

<div class="box">

<h2>🪙 Token Wallet</h2>

<p style="color:#aaa;">
Admin yahan player ke tokens manage kar sakta hai.
</p>

<input
id="walletUid"
placeholder="Free Fire UID">

<input
id="walletAmount"
type="number"
min="1"
placeholder="Token Amount">

<br>

<button onclick="checkWalletBalance()">
🔍 Check Balance
</button>

<button onclick="addWalletTokens()">
➕ Add Tokens
</button>

<button onclick="removeWalletTokens()">
➖ Remove Tokens
</button>

<h3 id="walletBalance">
Balance: —
</h3>

<p id="walletMessage"></p>

</div>


</div>

</div>


<script>


async function login() {

    const username =
        document.getElementById(
            "username"
        ).value;

    const password =
        document.getElementById(
            "password"
        ).value;

    const response =
        await fetch(
            "/admin-login",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    username: username,
                    password: password
                })
            }
        );

    const data =
        await response.json();

    if (data.success) {

        document.getElementById(
            "loginBox"
        ).classList.add("hidden");

        document.getElementById(
            "dashboard"
        ).classList.remove("hidden");

        loadTournaments();

    } else {

        document.getElementById(
            "loginMsg"
        ).innerText =
            "❌ " + data.message;
    }
}


async function logout() {

    await fetch(
        "/admin-logout"
    );

    location.reload();
}


async function createTournament() {

    const data = {

        name:
            document.getElementById(
                "tName"
            ).value,

        entry_fee:
            document.getElementById(
                "entryFee"
            ).value,

        max_players:
            document.getElementById(
                "maxPlayers"
            ).value,

        kill_reward:
            document.getElementById(
                "killReward"
            ).value,

        first_prize:
            document.getElementById(
                "firstPrize"
            ).value,

        date_time:
            document.getElementById(
                "dateTime"
            ).value
    };


    const response =
        await fetch(
            "/api/tournaments",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify(data)
            }
        );

    const result =
        await response.json();

    document.getElementById(
        "createMsg"
    ).innerText =
        result.success
        ? "✅ Tournament created!"
        : "❌ " + result.message;

    if (result.success) {

        loadTournaments();
    }
}


async function changePassword() {

    const currentPassword =
        document.getElementById(
            "currentPassword"
        ).value;

    const newPassword =
        document.getElementById(
            "newPassword"
        ).value;

    const confirmPassword =
        document.getElementById(
            "confirmPassword"
        ).value;

    const response =
        await fetch(
            "/api/admin/change-password",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    current_password:
                        currentPassword,

                    new_password:
                        newPassword,

                    confirm_password:
                        confirmPassword
                })
            }
        );

    const data =
        await response.json();

    document.getElementById(
        "passwordMsg"
    ).innerText =
        data.success
        ? "✅ " + data.message
        : "❌ " + data.message;

    if (data.success) {

        document.getElementById(
            "currentPassword"
        ).value = "";

        document.getElementById(
            "newPassword"
        ).value = "";

        document.getElementById(
            "confirmPassword"
        ).value = "";
    }
}


async function saveRoom(tournamentId) {

    const roomId =
        document.getElementById(
            "room-" + tournamentId
        ).value.trim();

    const roomPassword =
        document.getElementById(
            "roompass-" + tournamentId
        ).value.trim();

    const response =
        await fetch(
            `/api/admin/tournaments/${tournamentId}/room`,
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    room_id: roomId,

                    room_password:
                        roomPassword
                })
            }
        );

    const data =
        await response.json();

    alert(
        data.success
        ? "✅ Room details saved!"
        : "❌ " + data.message
    );

    if (data.success) {

        loadTournaments();
    }
}


async function deleteTournament(id) {

    const ok =
        confirm(
            "⚠️ Kya tum ye tournament delete karna chahte ho?"
        );

    if (!ok) return;


    const response =
        await fetch(
            `/api/tournaments/${id}`,
            {
                method: "DELETE"
            }
        );

    const data =
        await response.json();

    if (data.success) {

        alert(
            "✅ Tournament deleted."
        );

        loadTournaments();

    } else {

        alert(
            "❌ " + data.message
        );
    }
}


async function savePlayer(playerId) {

    const kills =
        document.getElementById(
            "kills-" + playerId
        ).value;

    const position =
        document.getElementById(
            "position-" + playerId
        ).value;


    const response =
        await fetch(
            "/api/players/" + playerId,
            {
                method: "PUT",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    kills: kills,
                    position: position
                })
            }
        );

    const result =
        await response.json();

    if (result.success) {

        document.getElementById(
            "saved-" + playerId
        ).innerText =
            "✅ Saved";

        setTimeout(() => {

            document.getElementById(
                "saved-" + playerId
            ).innerText = "";

        }, 2000);

    } else {

        alert(
            "❌ " + result.message
        );
    }
}


async function loadTournaments() {

    const response =
        await fetch(
            "/api/tournaments"
        );

    const tournaments =
        await response.json();

    const container =
        document.getElementById(
            "tournaments"
        );

    container.innerHTML = "";


    tournaments.forEach(t => {

        const revenue =
            t.players.length *
            t.entry_fee;

        const prizePool =
            t.first_prize;

        const killCost =
            t.players.reduce(
                (total, p) =>
                    total +
                    ((p.kills || 0) *
                    t.kill_reward),
                0
            );

        const profit =
            revenue -
            prizePool -
            killCost;


        let playersHTML = "";


        if (t.players.length > 0) {

            playersHTML = `

                <h3>👥 Players</h3>

                <table>

                    <tr>

                        <th>Player</th>
                        <th>UID</th>
                        <th>Kills</th>
                        <th>Position</th>
                        <th>Kill Reward</th>
                        <th>Save</th>

                    </tr>

                    ${t.players.map(p => `

                        <tr>

                            <td>
                                ${p.name}
                            </td>

                            <td>
                                ${p.uid}
                            </td>

                            <td>

                                <input
                                id="kills-${p.id}"
                                type="number"
                                min="0"
                                value="${p.kills || 0}"
                                style="width:60px">

                            </td>

                            <td>

                                <input
                                id="position-${p.id}"
                                type="number"
                                min="0"
                                value="${p.position || 0}"
                                style="width:60px">

                            </td>

                            <td>
                                ₹${(p.kills || 0) *
                                t.kill_reward}
                            </td>

                            <td>

                                <button
                                class="saveBtn"
                                onclick="savePlayer(${p.id})">

                                💾 Save

                                </button>

                                <div
                                id="saved-${p.id}">
                                </div>

                            </td>

                        </tr>

                    `).join("")}

                </table>
            `;

        } else {

            playersHTML =
                "<p>Abhi koi player registered nahi hai.</p>";
        }


        container.innerHTML += `

            <div class="tournament">

                <h2>
                    🏆 ${t.name}
                </h2>

                <p>
                    💰 Entry:
                    ₹${t.entry_fee}
                </p>

                <p>
                    👥 Players:
                    ${t.players.length}/${t.max_players}
                </p>

                <p>
                    🗡️ Per Kill:
                    ₹${t.kill_reward}
                </p>

                <p>
                    🥇 1st Prize:
                    ₹${t.first_prize}
                </p>

                <p>
                    📅 ${t.date_time}
                </p>

                <hr>


                <div class="roomBox">

                    <h3>
                        🎮 Room Details
                    </h3>

                    <input
                    id="room-${t.id}"
                    value="${t.room_id || ""}"
                    placeholder="Room ID">

                    <input
                    id="roompass-${t.id}"
                    value="${t.room_password || ""}"
                    placeholder="Room Password">

                    <button
                    onclick="saveRoom(${t.id})">

                    💾 Save Room Details

                    </button>

                    <p style="color:#aaa;">
                    Sirf is tournament ke registered
                    players ko room details dikhenge.
                    </p>

                </div>


                <hr>

                <p>
                    💵 Revenue:
                    ₹${revenue}
                </p>

                <p>
                    🎁 1st Prize:
                    ₹${prizePool}
                </p>

                <p>
                    🔫 Total Kill Payout:
                    ₹${killCost}
                </p>

                <p class="profit">
                    📈 Current Profit:
                    ₹${profit}
                </p>


                ${playersHTML}


                <button
                class="deleteBtn"
                onclick="deleteTournament(${t.id})">

                🗑️ Delete Tournament

                </button>

            </div>
        `;

    });


    if (tournaments.length === 0) {

        container.innerHTML =
            "<p>Abhi koi tournament nahi hai.</p>";
    }
}


/* =========================
   WALLET
========================= */


async function checkWalletBalance() {

    const uid =
        document.getElementById(
            "walletUid"
        ).value.trim();

    if (!uid) {

        alert(
            "UID enter karo."
        );

        return;
    }

    const response =
        await fetch(
            "/api/wallet/" +
            encodeURIComponent(uid)
        );

    const data =
        await response.json();

    if (data.success) {

        document.getElementById(
            "walletBalance"
        ).innerText =
            "Balance: " +
            data.balance +
            " Tokens";

    } else {

        document.getElementById(
            "walletMessage"
        ).innerText =
            data.message ||
            "Something went wrong.";
    }
}


async function addWalletTokens() {

    const uid =
        document.getElementById(
            "walletUid"
        ).value.trim();

    const amount =
        Number(
            document.getElementById(
                "walletAmount"
            ).value
        );

    if (!uid || !amount) {

        alert(
            "UID aur token amount enter karo."
        );

        return;
    }


    const response =
        await fetch(
            "/api/admin/wallet/add",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    uid: uid,
                    amount: amount
                })
            }
        );

    const data =
        await response.json();

    document.getElementById(
        "walletMessage"
    ).innerText =
        data.message || "Done";


    if (data.success) {

        document.getElementById(
            "walletBalance"
        ).innerText =
            "Balance: " +
            data.balance +
            " Tokens";
    }
}


async function removeWalletTokens() {

    const uid =
        document.getElementById(
            "walletUid"
        ).value.trim();

    const amount =
        Number(
            document.getElementById(
                "walletAmount"
            ).value
        );

    if (!uid || !amount) {

        alert(
            "UID aur token amount enter karo."
        );

        return;
    }


    const response =
        await fetch(
            "/api/admin/wallet/remove",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    uid: uid,
                    amount: amount
                })
            }
        );

    const data =
        await response.json();

    document.getElementById(
        "walletMessage"
    ).innerText =
        data.message || "Done";


    if (data.success) {

        document.getElementById(
            "walletBalance"
        ).innerText =
            "Balance: " +
            data.balance +
            " Tokens";
    }
}

</script>

</body>
</html>
