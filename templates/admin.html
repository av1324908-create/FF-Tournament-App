<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Admin Panel - Free Fire Tournament Hub</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0b0b;
    color: white;
}

.container {
    width: 95%;
    max-width: 1100px;
    margin: auto;
}

header {
    background: #111;
    padding: 18px 0;
    border-bottom: 1px solid #333;
}

header h1 {
    margin: 0;
    text-align: center;
    color: #ff9800;
}

.box {
    background: #151515;
    padding: 20px;
    border-radius: 13px;
    margin: 20px 0;
    border: 1px solid #292929;
}

h2 {
    color: #ff9800;
}

input,
textarea,
select {
    width: 100%;
    padding: 12px;
    margin: 7px 0;
    border: none;
    border-radius: 7px;
    background: #fff;
    color: #111;
}

textarea {
    min-height: 120px;
    resize: vertical;
}

button {
    padding: 11px 18px;
    border: none;
    border-radius: 7px;
    background: #ff9800;
    color: #111;
    font-weight: bold;
    cursor: pointer;
    margin: 5px 4px 5px 0;
}

button:hover {
    opacity: .9;
}

.danger {
    background: #d32f2f;
    color: white;
}

.blue {
    background: #008cff;
    color: white;
}

.green {
    background: #159447;
    color: white;
}

.hidden {
    display: none;
}

.message {
    margin-top: 10px;
    font-weight: bold;
}

.tournament {
    background: #101010;
    padding: 16px;
    border-radius: 10px;
    margin-top: 12px;
    border: 1px solid #292929;
}

.tournament h3 {
    color: #ff9800;
    margin-top: 0;
}

.player {
    background: #181818;
    padding: 10px;
    border-radius: 7px;
    margin: 7px 0;
}

.player input {
    width: auto;
    max-width: 120px;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.editor-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.notice-item {
    background: #101010;
    border-left: 4px solid #ff9800;
    padding: 13px;
    border-radius: 8px;
    margin-top: 10px;
}

.notice-item h3 {
    margin: 0 0 7px;
    color: #ff9800;
}

.notice-item p {
    white-space: pre-wrap;
    line-height: 1.5;
}

.status {
    padding: 5px 9px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: bold;
}

.status-upcoming {
    background: #164b23;
    color: #5cff7b;
}

.status-live {
    background: #571616;
    color: #ff5555;
}

.status-completed {
    background: #333;
    color: #ccc;
}

.rules-preview {
    background: #0c0c0c;
    padding: 12px;
    border-radius: 8px;
    white-space: pre-wrap;
    line-height: 1.6;
    color: #ddd;
}

@media(max-width:700px) {

    .grid,
    .editor-grid {
        grid-template-columns: 1fr;
    }

}

</style>

</head>

<body>

<header>

<div class="container">

<h1>
🔥 Free Fire Tournament Hub — Admin Panel
</h1>

</div>

</header>


<div class="container">


<!-- =====================================================
     ADMIN LOGIN
====================================================== -->

<input

<button

    Login
</button>

    id="loginMessage"

</div>


<!-- =====================================================
     ADMIN DASHBOARD
====================================================== -->

<div
    id="dashboard"

>


<!-- LOGOUT -->

<div class="box">

<button
    class="danger"
    onclick="adminLogout()"
>
    🚪 Logout
</button>

</div>


<!-- =====================================================
     CREATE TOURNAMENT
====================================================== -->

<div class="box">

<h2>
➕ Create Tournament
</h2>

<div class="grid">

<input
    id="tName"

>

<input
    id="tEntryFee"

    placeholder="Entry Fee"
>

<input
    id="tMaxPlayers"
    type="number"
    min="1"
    placeholder="Max Players"
>

<input
    id="tKillReward"
    type="number"
    min="0"
    placeholder="Per Kill Reward"
>

<input
    id="tFirstPrize"
    type="number"
    min="0"
    placeholder="1st Prize"
>

<input
    id="tDateTime"
    placeholder="Date & Time e.g. 25/09/26 20:00"
>

</div>


<textarea
    id="tRules"
    placeholder="Tournament Rules..."
></textarea>


<button
    onclick="createTournament()"
>
    🚀 Create Tournament
</button>


<div

></div>

</div>


<!-- =====================================================
     EDIT TOURNAMENT
====================================================== -->

<div class="box">

<h2>
✏️ Edit Tournament
</h2>

<p style="color:#aaa;">
Sirf upcoming tournament jisme slots available hain
edit kiya ja sakta hai.
</p>


<select
    id="editTournamentSelect"
>
<option value="">
Tournament select karo
</option>
</select>


<div class="editor-grid">

<input
    id="editName"
    placeholder="Tournament Name"
>

<input
    id="editEntryFee"
    type="number"
    min="0"
    placeholder="Entry Fee"
>

<input
    id="editMaxPlayers"
    type="number"
    min="1"
    placeholder="Max Players"
>

<input
    id="editKillReward"
    type="number"
    min="0"
    placeholder="Per Kill Reward"
>

<input
    id="editFirstPrize"
    type="number"
    min="0"
    placeholder="1st Prize"
>

<input
    id="editDateTime"
    placeholder="Date & Time"
>

</div>


<textarea
    id="editRules"
    placeholder="Tournament Rules"
></textarea>

    onclick="saveTournamentEdit()"

💾 Save Tournament Changes
</button>

</div>


<!-- =====================================================

<div class="box">

<h2>

</h2>

<input

    placeholder="Notice message..."
></textarea>


<label>

<input

>

Public notice active rakho

➕ Add Notice

</div>


<!-- =====================================================

====================================================== -->

<div class="box">

<h2>

</h2>


<input

>

    type="number"

>


<button
    class="green"
    onclick="addTokens()"
>
➕ Add Tokens

</button>

></div>

    style="

    "
></div>

====================================================== -->

<div class="box">

<h2>
🔑 Change Admin Password
</h2>


<input
    id="currentAdminPassword"
    type="password"
    placeholder="Current Password"
>


<input
    id="newAdminPassword"
    type="password"
    placeholder="New Password"
>


<input
    id="confirmAdminPassword"
    type="password"
    placeholder="Confirm New Password"
>


<button
    onclick="changeAdminPassword()"
>
🔐 Change Password
</button>


<div
    id="passwordMessage"
    class="message"
></div>

</div>


<!-- =====================================================
     TOURNAMENT LIST
====================================================== -->

<div class="box">

<h2>
🎮 All Tournaments
</h2>


<div
    id="tournamentList"
>
Loading tournaments...
</div>

</div>


</div>

</div>


<script>


/* =====================================================
   ADMIN LOGIN
====================================================== */

async function adminLogin() {

    const username =
        document
            .getElementById(
                "adminUsername"
            )
            .value
            .trim();


    const password =
        document
            .getElementById(
                "adminPassword"
            )
            .value;


    const message =
        document
            .getElementById(
                "loginMessage"
            );


    if (
        !username ||
        !password
    ) {

        message.innerText =
            "❌ Username aur password bharo.";

        return;

    }


    try {

        const response =
            await fetch(
                "/api/admin/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    credentials:
                        "same-origin",

                    body:
                        JSON.stringify({
                            username,
                            password
                        })
                }
            );


        const data =
            await response.json();


        if (
            data.success
        ) {

            document
                .getElementById(
                    "loginBox"
                )
                .classList
                .add("hidden");


            document
                .getElementById(
                    "dashboard"
                )
                .classList
                .remove("hidden");


            await loadTournaments();

            await loadEditableTournaments();

            await loadAdminNotices();

        }

        else {

            message.innerText =
                "❌ " +
                (
                    data.message ||
                    "Login failed."
                );

        }

    }

    catch (error) {

        message.innerText =
            "❌ Server error.";

    }

}


/* =====================================================
   ADMIN LOGOUT
====================================================== */

async function adminLogout() {

    await fetch(
        "/api/admin/logout",
        {
            method: "POST",
            credentials: "same-origin"
        }
    );

    location.reload();

}


/* =====================================================
   CREATE TOURNAMENT
====================================================== */

async function createTournament() {

    const name =
        document
            .getElementById("tName")
            .value
            .trim();


    const entry_fee =
        document
            .getElementById("tEntryFee")
            .value;


    const max_players =
        document
            .getElementById("tMaxPlayers")
            .value;


    const kill_reward =
        document
            .getElementById("tKillReward")
            .value;


    const first_prize =
        document
            .getElementById("tFirstPrize")
            .value;


    const date_time =
        document
            .getElementById("tDateTime")
            .value
            .trim();


    const rules =
        document
            .getElementById("tRules")
            .value;


    const message =
        document
            .getElementById(
                "createMessage"
            );


    if (
        !name ||
        !date_time
    ) {

        message.innerText =
            "❌ Name aur date/time required hai.";

        return;

    }


    try {

        const response =
            await fetch(
                "/api/tournaments",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    credentials:
                        "same-origin",

                    body:
                        JSON.stringify({

                            name,

                            entry_fee,

                            max_players,

                            kill_reward,

                            first_prize,

                            date_time,

                            rules

                        })
                }
            );


        const data =
            await response.json();


        if (
            data.success
        ) {

            message.innerText =
                "✅ Tournament create ho gaya.";

            document
                .getElementById(
                    "tName"
                )
                .value = "";

            document
                .getElementById(
                    "tEntryFee"
                )
                .value = "";

            document
                .getElementById(
                    "tMaxPlayers"
                )
                .value = "";

            document
                .getElementById(
                    "tKillReward"
                )
                .value = "";

            document
                .getElementById(
                    "tFirstPrize"
                )
                .value = "";

            document
                .getElementById(
                    "tDateTime"
                )
                .value = "";

            document
                .getElementById(
                    "tRules"
                )
                .value = "";


            await loadTournaments();

            await loadEditableTournaments();

        }

        else {

            message.innerText =
                "❌ " +
                (
                    data.message ||
                    "Create failed."
                );

        }

    }

    catch (error) {

        message.innerText =
            "❌ Server error.";

    }

}


/* =====================================================
   LOAD TOURNAMENTS
====================================================== */

async function loadTournaments() {

    try {

        const response =
            await fetch(
                "/api/tournaments"
            );


        const tournaments =
            await response.json();


        const box =
            document
                .getElementById(
                    "tournamentList"
                );


        if (
            !Array.isArray(
                tournaments
            ) ||
            tournaments.length === 0
        ) {

            box.innerHTML =
                "No tournaments found.";

            return;

        }


        box.innerHTML =
            tournaments
                .map(
                    t =>
                        renderTournament(
                            t
                        )
                )
                .join("");

    }

    catch (error) {

        document
            .getElementById(
                "tournamentList"
            )
            .innerText =
            "❌ Tournaments load nahi ho paaye.";

    }

}


/* =====================================================
   RENDER TOURNAMENT
====================================================== */

function renderTournament(t) {

    const players =
        Array.isArray(t.players)
            ? t.players
            : [];


    let statusHTML = "";


    if (
        t.status ===
        "live"
    ) {

        statusHTML = `
            <span
                class="
                    status
                    status-live
                "
            >
                🔴 LIVE
            </span>
        `;

    }

    else if (
        t.status ===
        "completed"
    ) {

        statusHTML = `
            <span
                class="
                    status
                    status-completed
                "
            >
                🏁 COMPLETED
            </span>
        `;

    }

    else {

        statusHTML = `
            <span
                class="
                    status
                    status-upcoming
                "
            >
                🟢 UPCOMING
            </span>
        `;

    }


    return `

        <div class="tournament">

            <h3>
                🎮
                ${escapeHTML(t.name)}
            </h3>


            <p>

                Status:
                ${statusHTML}

            </p>


            <p>

                💰 Entry:
                ₹${t.entry_fee}

                <br>

                👥 Players:
                ${players.length}/${t.max_players}

                <br>

                🎯 Per Kill:
                ₹${t.kill_reward}

                <br>

                🏆 First Prize:
                ₹${t.first_prize}

                <br>

                📅 Date:
                ${escapeHTML(
                    t.date_time
                )}

            </p>


            ${
                t.rules
                    ? `
                        <div
                            class="rules-preview"
                        >
                            📜 Rules:

                            <br><br>

                            ${escapeHTML(
                                t.rules
                            )}
                        </div>
                    `
                    : ""
            }


            <hr
                style="
                    border-color:#333;
                    margin:15px 0;
                "
            >


            <h4>
                🎮 Room Details
            </h4>


            <input
                id="
                    room-id-${t.id}
                "
                placeholder="Room ID"
                value="
                    ${escapeHTML(
                        t.room_id || ""
                    )}
                "
            >


            <input
                id="
                    room-password-${t.id}
                "
                placeholder="Room Password"
                value="
                    ${escapeHTML(
                        t.room_password || ""
                    )}
            ">


            <button
                class="blue"
                onclick="
                    saveRoom(
                        ${t.id}
                    )
                "
            >
                💾 Save Room
            </button>


            <button
                class="danger"
                onclick="
                    deleteTournament(
                        ${t.id}
                    )
                "
            >
                🗑️ Delete Tournament
            </button>


            <h4>
                👥 Players
            </h4>


            ${
                players.length
                    ? players
                        .map(
                            p =>
                                renderPlayer(
                                    t,
                                    p
                                )
                        )
                        .join("")
                    : `
                        <p
                            style="
                                color:#aaa;
                            "
                        >
                            Abhi koi player
                            registered nahi hai.
                        </p>
                    `
            }

        </div>

    `;

}


/* =====================================================
   RENDER PLAYER
====================================================== */

function renderPlayer(t, p) {

    return `

        <div class="player">

            <strong>
                ${escapeHTML(
                    p.name
                )}
            </strong>

            <br>

            UID:
            ${escapeHTML(
                p.uid
            )}


            <br><br>


            Position:

            <input
                type="number"
                min="0"
                value="
                    ${p.position || 0}
                "
                id="
                    position-${p.id}
                "
            >


            Kills:

            <input
                type="number"
                min="0"
                value="
                    ${p.kills || 0}
                "
                id="
                    kills-${p.id}
                "
            >


            <button
                class="green"
                onclick="
                    updatePlayer(
                        ${p.id}
                    )
                "
            >
                💾 Save Result
            </button>

        </div>

    `;

}


/* =====================================================
   UPDATE PLAYER RESULT
====================================================== */

async function updatePlayer(id) {

    const position =
        document
            .getElementById(
                `position-${id}`
            )
            .value;


    const kills =
        document
            .getElementById(
                `kills-${id}`
            )
            .value;


    const response =
        await fetch(
            `/api/admin/players/${id}`,
            {
                method: "PUT",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                credentials:
                    "same-origin",

                body:
                    JSON.stringify({
                        position,
                        kills
                    })
            }
        );


    const data =
        await response.json();


    alert(
        data.success
            ? "✅ Result saved."
            : "❌ " +
              (
                  data.message ||
                  "Save failed."
              )
    );


    if (
        data.success
    ) {

        loadTournaments();

    }

}


/* =====================================================
   SAVE ROOM
====================================================== */

async function saveRoom(id) {

    const room_id =
        document
            .getElementById(
                `room-id-${id}`
            )
            .value
            .trim();


    const room_password =
        document
            .getElementById(
                `room-password-${id}`
            )
            .value
            .trim();


    const response =
        await fetch(
            `/api/admin/tournaments/${id}/room`,
            {
                method: "PUT",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                credentials:
                    "same-origin",

                body:
                    JSON.stringify({
                        room_id,
                        room_password
                    })
            }
        );


    const data =
        await response.json();


    alert(
        data.success
            ? "✅ Room details saved."
            : "❌ " +
              (
                  data.message ||
                  "Save failed."
              )
    );

}


/* =====================================================
   DELETE TOURNAMENT
====================================================== */

async function deleteTournament(id) {

    if (
        !confirm(
            "Kya tum ye tournament delete karna chahte ho?"
        )
    ) {

        return;

    }


    const response =
        await fetch(
            `/api/tournaments/${id}`,
            {
                method: "DELETE",

                credentials:
                    "same-origin"
            }
        );


    const data =
        await response.json();


    if (
        data.success
    ) {

        alert(
            "✅ Tournament delete ho gaya."
        );

        await loadTournaments();

        await loadEditableTournaments();

    }

    else {

        alert(
            "❌ " +
            (
                data.message ||
                "Delete failed."
            )
        );

    }

}


/* =====================================================
   EDIT TOURNAMENT LIST
====================================================== */

async function loadEditableTournaments() {

    const select =
        document
            .getElementById(
                "editTournamentSelect"
            );


    if (!select) {

        return;

    }


    try {

        const response =
            await fetch(
                "/api/tournaments"
            );


        const tournaments =
            await response.json();


        select.innerHTML =
            `
            <option value="">
                Tournament select karo
            </option>
            `;


        tournaments.forEach(
            t => {

                const players =
                    Array.isArray(
                        t.players
                    )
                        ? t.players
                        : [];


                if (
                    t.status ===
                        "upcoming" &&
                    players.length <
                        t.max_players
                ) {

                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        t.id;


                    option.textContent =
                        `${t.name} — ` +
                        `${players.length}/` +
                        `${t.max_players} booked`;


                    select.appendChild(
                        option
                    );

                }

            }
        );


        select.onchange =
            () => {

                const t =
                    tournaments.find(
                        x =>
                            String(
                                x.id
                            ) ===
                            select.value
                    );


                if (!t) {

                    return;

                }


                document
                    .getElementById(
                        "editName"
                    )
                    .value =
                    t.name || "";


                document
                    .getElementById(
                        "editEntryFee"
                    )
                    .value =
                    t.entry_fee ?? 0;


                document
                    .getElementById(
                        "editMaxPlayers"
                    )
                    .value =
                    t.max_players ?? 0;


                document
                    .getElementById(
                        "editKillReward"
                    )
                    .value =
                    t.kill_reward ?? 0;


                document
                    .getElementById(
                        "editFirstPrize"
                    )
                    .value =
                    t.first_prize ?? 0;


                document
                    .getElementById(
                        "editDateTime"
                    )
                    .value =
                    t.date_time || "";


                document
                    .getElementById(
                        "editRules"
                    )
                    .value =
                    t.rules || "";

            };

    }

    catch (error) {

        console.error(
            error
        );

    }

}


/* =====================================================
   SAVE TOURNAMENT EDIT
====================================================== */

async function saveTournamentEdit() {

    const id =
        document
            .getElementById(
                "editTournamentSelect"
            )
            .value;


    const message =
        document
            .getElementById(
                "editTournamentMsg"
            );


    if (!id) {

        message.innerText =
            "❌ Pehle tournament select karo.";

        return;

    }


    const payload = {

        name:
            document
                .getElementById(
                    "editName"
                )
                .value
                .trim(),

        entry_fee:
            document
                .getElementById(
                    "editEntryFee"
                )

                    data.message ||

                );

        }

    }

    catch (error) {

        message.innerText =
            "❌ Server error.";

    }

}

/* =====================================================
   ADMIN PASSWORD
====================================================== */

async function changeAdminPassword() {

    const currentPassword =
        document
            .getElementById(
                "currentAdminPassword"
            )
            .value;


    const newPassword =
        document
            .getElementById(
                "newAdminPassword"
            )
            .value;


    const confirmPassword =
        document
            .getElementById(
                "confirmAdminPassword"
            )
            .value;


    const message =
        document
            .getElementById(
                "passwordMessage"
            );


    if (
        !currentPassword ||
        !newPassword ||
        !confirmPassword
    ) {

        message.innerText =
            "❌ Sabhi password fields bharo.";

        return;

    }


    if (
        newPassword !==
        confirmPassword
    ) {

        message.innerText =
            "❌ New passwords match nahi kar rahe.";

        return;

    }


    try {

        const response =
            await fetch(
                "/api/admin/change-password",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    credentials:
                        "same-origin",

                    body:
                        JSON.stringify({

                            current_password:
                                currentPassword,

                            new_password:
                                newPassword

                        })
                }
            );


        const data =
            await response.json();


        message.innerText =
            data.success
                ? "✅ Password successfully changed."
                : "❌ " +
                  (
                      data.message ||
                      "Password change failed."
                  );

    }

    catch (error) {

        message.innerText =
            "❌ Server error.";

    }

}

    catch (error) {

    }

}


/* =====================================================
   LOAD ADMIN NOTICES
====================================================== */

async function loadAdminNotices() {

    const box =
        document
            .getElementById(
                "adminNotices"
            );


    if (!box) {

        return;

    }


    try {

        const response =
            await fetch(
                "/api/admin/notices",
                {
                    credentials:
                        "same-origin"
                }
            );


        const notices =
            await response.json();


        if (
            !Array.isArray(
                notices
            ) ||
            notices.length === 0
        ) {

            box.innerHTML =
                `
                <p
                    style="
                        color:#aaa;
                    "
                >
                    Abhi koi notice nahi hai.
                </p>
                `;

            return;

        }


        box.innerHTML =
            notices
                .map(
                    n => `

                    <div
                        class="notice-item"
                    >

                        <h3>
                            📌
                            ${escapeHTML(
                                n.title
                            )}
                        </h3>

                        <p>
                            ${escapeHTML(
                                n.message
                            )}
                        </p>

                        <p
                            style="
                                color:#aaa;
                            "
                        >

                            Status:
                            ${
                                n.active
                                    ? "🟢 Public"
                                    : "⚪ Hidden"
                            }

                        </p>


                        <button
                            class="danger"
                            onclick="
                                deleteNotice(
                                    ${n.id}
                                )
                            "
                        >
                            🗑️ Delete
                        </button>

                    </div>

                `
                )
                .join("");

    }

    catch (error) {

        box.innerHTML =
            `
            <p style="color:#f55;">
                Notices load nahi ho paaye.
            </p>
            `;

    }

}


/* =====================================================
   DELETE NOTICE
====================================================== */

async function deleteNotice(id) {

    if (
        !confirm(
            "Ye notice delete karna hai?"
        )
    ) {

        return;

    }


    try {

        const response =
            await fetch(
                `/api/admin/notices/${id}`,
                {
                    method: "DELETE",

                    credentials:
                        "same-origin"
                }
            );


        const data =
            await response.json();


        if (
            data.success
        ) {

            await loadAdminNotices();

        }

        else {

            alert(
                "❌ " +
                (
                    data.message ||
                    "Delete failed."
                )
            );

        }

    }

    catch (error) {

        alert(
            "❌ Server error."
        );

    }

}


/* =====================================================
   ESCAPE HTML
====================================================== */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =====================================================
   AUTO CHECK ADMIN SESSION
====================================================== */

async function checkAdminSession() {

    try {

        const response =
            await fetch(
                "/api/admin/me",
                {
                    credentials:
                        "same-origin"
                }
            );


        const data =
            await response.json();


        if (
            data.logged_in
        ) {

            document
                .getElementById(
                    "loginBox"
                )
                .classList
                .add("hidden");


            document
                .getElementById(
                    "dashboard"
                )
                .classList
                .remove("hidden");


            await loadTournaments();

            await loadEditableTournaments();

            await loadAdminNotices();

        }

    }

    catch (error) {

        console.log(
            "Admin session check failed"
        );

    }

}


/* =====================================================
   START
====================================================== */

checkAdminSession();
